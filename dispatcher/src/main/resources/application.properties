spring.application.name=dispatcher


server.port=${DISPATCHER_PORT}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';

spring.kafka.properties.ssl.truststore.location=/app/kafka-truststore.jks
spring.kafka.properties.ssl.truststore.password=${TRUST_STORE_PASSWORD}
spring.kafka.properties.ssl.truststore.type=JKS

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*